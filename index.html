<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VoiLearn - Interactive Learning App</title>

    <meta name="description" content="VoiLearn - Offline Interactive Learning Application">
    <meta name="theme-color" content="#4f46e5">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">

    <!-- Icons -->
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>

<body>

    <header class="navbar">
        <div class="logo">🧠 VoiLearn</div>

        <nav>
            <a href="#home" class="nav-link">Home</a>
            <a href="#notes" class="nav-link">Notes</a>
            <a href="#progress" class="nav-link">Progress</a>

            <button id="themeToggleBtn" class="theme-toggle">
                🌙 Dark
            </button>
        </nav>
    </header>

    <main id="app-container" class="container">
        <section class="loading-view">
            Loading learning modules...
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 VoiLearn. Works offline.</p>
    </footer>

    <!-- Main App -->
    <script type="module" src="js/app.js?v=1.0.0"></script>

    <!-- Service Worker -->
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", async () => {

                try {
                    const registration = await navigator.serviceWorker.register("./service-worker.js");

                    // Check for updates every time the app starts
                    registration.update();

                    // Reload automatically when a new SW takes control
                    let refreshing = false;

                    navigator.serviceWorker.addEventListener("controllerchange", () => {
                        if (refreshing) return;
                        refreshing = true;
                        window.location.reload();
                    });

                } catch (err) {
                    console.error("Service Worker registration failed:", err);
                }

            });
        }
    </script>

</body>

</html>
